      <rect x="30" y="700" width="3" height="3"/>
      <rect x="60" y="730" width="3" height="3"/>
      <rect x="130" y="700" width="3" height="3"/>
      <rect x="200" y="720" width="3" height="3"/>
      <rect x="270" y="700" width="3" height="3"/>
      <rect x="340" y="730" width="3" height="3"/>
      <rect x="420" y="620" width="3" height="3"/>
      <rect x="445" y="660" width="3" height="3"/>
      <rect x="470" y="700" width="3" height="3"/>
      <rect x="540" y="640" width="3" height="3"/>
      <rect x="615" y="660" width="3" height="3"/>
      <rect x="640" y="720" width="3" height="3"/>
      <rect x="710" y="700" width="3" height="3"/>
      <rect x="780" y="680" width="3" height="3"/>
      <rect x="965" y="680" width="3" height="3"/>
      <rect x="1030" y="560" width="3" height="3"/>
      <rect x="1055" y="620" width="3" height="3"/>
      <rect x="1140" y="600" width="3" height="3"/>
      <rect x="1160" y="680" width="3" height="3"/>
      <rect x="1218" y="540" width="3" height="3"/>
      <rect x="1240" y="600" width="3" height="3"/>
      <rect x="1275" y="540" width="3" height="3"/>
      <rect x="1295" y="600" width="3" height="3"/>
      <rect x="1340" y="700" width="3" height="3"/>
      <rect x="1420" y="640" width="3" height="3"/>
      <rect x="1490" y="680" width="3" height="3"/>
      <rect x="1580" y="620" width="3" height="3"/>
      <rect x="1648" y="580" width="3" height="3"/>
      <rect x="1675" y="640" width="3" height="3"/>
      <rect x="1730" y="680" width="3" height="3"/>
      <rect x="1800" y="640" width="3" height="3"/>
