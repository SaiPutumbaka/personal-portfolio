  <!-- Foreground silhouette (treetops / overpass) -->
  <path d="M0 920 L80 905 L160 920 L240 900 L320 925 L420 905 L520 925 L620 905 L720 925 L820 905 L920 925 L1020 905 L1120 925 L1220 905 L1320 925 L1420 905 L1520 925 L1620 905 L1720 925 L1820 905 L1920 925 L2020 905 L2120 925 L2220 905 L2320 925 L2400 910 L2400 1000 L0 1000 Z"
    fill="url(#bldgNear)"/>
</svg>
