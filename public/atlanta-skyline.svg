<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1000" preserveAspectRatio="xMidYMax slice" width="2400" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a30"/>
      <stop offset="35%" stop-color="#1a2f4e"/>
      <stop offset="65%" stop-color="#5b3b56"/>
      <stop offset="85%" stop-color="#c8623f"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#ffd9a8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f4a261" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f4a261" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bldgFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2640" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a1426" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bldgMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1830"/>
      <stop offset="100%" stop-color="#04091a"/>
    </linearGradient>
    <linearGradient id="bldgNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="haze" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="2400" height="1000" fill="url(#sky)"/>
  <!-- Sun glow -->
  <ellipse cx="1300" cy="760" rx="900" ry="220" fill="url(#sun)"/>

  <!-- Distant stars -->
  <g fill="#fff7e8" opacity="0.55">
    <circle cx="180" cy="120" r="1.2"/>
    <circle cx="420" cy="60" r="1.4"/>
    <circle cx="760" cy="180" r="1.1"/>
    <circle cx="1100" cy="80" r="1.6"/>
    <circle cx="1480" cy="140" r="1.2"/>
    <circle cx="1820" cy="60" r="1.4"/>
    <circle cx="2180" cy="180" r="1.2"/>
    <circle cx="320" cy="220" r="1"/>
    <circle cx="980" cy="240" r="1.3"/>
    <circle cx="1660" cy="220" r="1.1"/>
  </g>

  <!-- Far ridge (haze) -->
  <g filter="url(#haze)" opacity="0.85">
    <path d="M0 700 L120 690 L160 670 L240 680 L320 660 L380 670 L460 640 L520 660 L600 650 L680 630 L760 660 L840 645 L920 660 L1000 640 L1100 660 L1200 635 L1280 660 L1360 640 L1460 655 L1540 635 L1640 660 L1720 640 L1820 660 L1920 635 L2020 655 L2120 640 L2220 660 L2320 640 L2400 660 L2400 1000 L0 1000 Z"
      fill="url(#bldgFar)"/>
  </g>

  <!-- Mid skyline (Midtown / Downtown silhouettes) -->
  <g fill="url(#bldgMid)">
    <!-- Generic mid blocks -->
    <rect x="0"    y="630" width="100" height="370"/>
    <rect x="100"  y="600" width="60"  height="400"/>
    <rect x="160"  y="640" width="80"  height="360"/>
    <rect x="250"  y="610" width="55"  height="390"/>
    <rect x="310"  y="650" width="70"  height="350"/>
    <!-- One Atlantic Center — pyramidal top -->
    <rect x="400"  y="540" width="90"  height="460"/>
    <polygon points="400,540 445,470 490,540"/>
    <!-- Promenade II — chevron top -->
    <rect x="510"  y="560" width="70"  height="440"/>
    <polygon points="510,560 545,510 580,560"/>
    <!-- 1180 Peachtree -->
    <rect x="600"  y="580" width="60"  height="420"/>
    <!-- Generic -->
    <rect x="675"  y="620" width="70"  height="380"/>
    <rect x="755"  y="600" width="55"  height="400"/>
    <!-- Bank of America Plaza — iconic pyramid spire -->
    <rect x="830"  y="380" width="100" height="620"/>
    <polygon points="830,380 880,290 930,380"/>
    <rect x="876"  y="220" width="8"   height="70"/>
    <!-- Generic mid block -->
    <rect x="945"  y="600" width="55"  height="400"/>
    <!-- SunTrust Plaza — stepped silhouette -->
    <rect x="1010" y="480" width="85"  height="520"/>
    <rect x="1030" y="440" width="45"  height="80"/>
    <polygon points="1030,440 1052,400 1075,440"/>
    <!-- Westin Peachtree Plaza — cylinder shape -->
    <rect x="1115" y="500" width="70"  height="500" rx="35" ry="0"/>
    <ellipse cx="1150" cy="500" rx="35" ry="14"/>
    <!-- 191 Peachtree Towers (twin pyramids) -->
    <rect x="1205" y="460" width="50"  height="540"/>
    <polygon points="1205,460 1230,420 1255,460"/>
    <rect x="1262" y="460" width="50"  height="540"/>
    <polygon points="1262,460 1287,420 1312,460"/>
    <!-- Generic blocks -->
    <rect x="1325" y="600" width="70"  height="400"/>
    <rect x="1405" y="560" width="55"  height="440"/>
    <rect x="1470" y="600" width="80"  height="400"/>
    <rect x="1560" y="540" width="65"  height="460"/>
    <!-- Truist Plaza (octagon-top) -->
    <rect x="1635" y="510" width="70"  height="490"/>
    <polygon points="1635,510 1670,470 1705,510"/>
    <!-- Generic -->
    <rect x="1715" y="600" width="60"  height="400"/>
    <rect x="1785" y="580" width="70"  height="420"/>
    <rect x="1865" y="620" width="55"  height="380"/>
    <!-- Coca-Cola HQ slab -->
    <rect x="1930" y="560" width="100" height="440"/>
    <!-- More right-side filler -->
    <rect x="2040" y="610" width="70"  height="390"/>
    <rect x="2120" y="580" width="60"  height="420"/>
    <rect x="2190" y="630" width="80"  height="370"/>
    <rect x="2280" y="600" width="55"  height="400"/>
    <rect x="2345" y="640" width="55"  height="360"/>
  </g>

